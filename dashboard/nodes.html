<!doctype html>
<html><head><meta charset="utf-8"><title>TAVDB Nodes</title><link rel="stylesheet" href="/dashboard/site.css"></head>
<body><nav><b>✓ TAVDB</b><a href="/dashboard/">Dashboard</a><a href="/dashboard/queries.html">Query Studio</a><a class="active" href="/dashboard/nodes.html">Nodes</a><a href="/dashboard/audit.html">Audit Logs</a><a href="/dashboard/architecture.html">Architecture</a></nav>
<main><h1>Node Inventory</h1><p class="muted">Live health refreshes every 5 seconds. Sign in through Query Studio first.</p><section class="panel"><table><thead><tr><th>Node</th><th>Trust</th><th>Status</th><th>Last Check</th><th>Operations</th><th>Tables</th></tr></thead><tbody id="rows"></tbody></table></section></main>
<script src="/dashboard/site.js"></script><script>
const render=async()=>{try{const [nodes,health]=await Promise.all([api('/nodes'),api('/nodes/health')]),state=Object.fromEntries(health.map(x=>[x.node,x]));rows.innerHTML=nodes.map(x=>{const h=state[x.name],status=h?.status||x.status,last=h?.last_health_check?new Date(h.last_health_check).toLocaleTimeString():'—';return `<tr><td>${x.name}</td><td>${x.trust_level}</td><td>${tag(status)}</td><td title="${h?.reason||''}">${last}</td><td>${x.allowed_operations}</td><td>${x.allowed_tables}</td></tr>`}).join('')}catch(e){rows.innerHTML='<tr><td colspan=6>'+e.message+'</td></tr>'}};render();setInterval(render,5000)
</script></body></html>
