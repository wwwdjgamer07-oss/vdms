<!doctype html><html><head><meta charset="utf-8"><title>TAVDB Query Studio</title><link rel="stylesheet" href="/dashboard/site.css"></head><body><nav><b>✓ TAVDB</b><a href="/dashboard/">Dashboard</a><a class="active" href="/dashboard/queries.html">Query Studio</a><a href="/dashboard/nodes.html">Nodes</a><a href="/dashboard/audit.html">Audit Logs</a><a href="/dashboard/architecture.html">Architecture</a></nav><main><h1>Query Studio</h1><section class="panel"><div class="row"><input id="user" value="operator" placeholder="Username"><input id="pass" value="password1" type="password"><button onclick="auth()">Sign in</button></div><p id="state" class="muted">Sign in to execute a query.</p><select id="mode" onchange="input.value=this.value==='natural'?'Show customer names':'SELECT name FROM customers'"><option value="natural">Normal English</option><option value="sql">Safe SQL</option></select><textarea id="input">Show customer names</textarea><select id="node"><option value="">Automatic routing</option><option value="non-trusted-node">Prefer non-trusted</option><option value="semi-trusted-node">Prefer semi-trusted</option><option value="trusted-node">Prefer trusted</option></select><button onclick="run()">Evaluate and execute</button><div id="out" class="result muted">The virtual layer validates every request before routing.</div></section></main><script src="/dashboard/site.js"></script><script>async function auth(){let b=JSON.stringify({username:user.value,password:pass.value}),r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:b});if(r.status===401){await fetch('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:b});r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:b})}let d=await r.json();if(d.access_token){localStorage.tavdb=d.access_token;state.textContent='Signed in as '+user.value}else out.textContent=d.detail}async function run(){try{let natural=mode.value==='natural',d=await api(natural?'/queries/natural':'/queries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(natural?{prompt:input.value,preferred_node:node.value||null}:{sql:input.value,preferred_node:node.value||null})});out.innerHTML=tag(d.decision)+' <b>'+d.node+'</b> — '+d.reason+(d.interpreted_sql?'<pre>'+d.interpreted_sql+'</pre>':'')+'<pre>'+JSON.stringify(d.result,null,2)+'</pre>'}catch(e){out.textContent=e.message}}</script></body></html>
