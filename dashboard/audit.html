<!doctype html><html><head><meta charset="utf-8"><title>TAVDB Audit Logs</title><link rel="stylesheet" href="/dashboard/site.css"></head><body><nav><b>✓ TAVDB</b><a href="/dashboard/">Dashboard</a><a href="/dashboard/queries.html">Query Studio</a><a href="/dashboard/nodes.html">Nodes</a><a class="active" href="/dashboard/audit.html">Audit Logs</a><a href="/dashboard/architecture.html">Architecture</a></nav><main><h1>Audit Logs</h1><section class="panel"><table><thead><tr><th>Operation</th><th>Table / columns</th><th>Node</th><th>Decision</th><th>Reason</th><th>Time</th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="/dashboard/site.js"></script><script>api('/audit/logs').then(l=>rows.innerHTML=l.map(x=>`<tr><td>${x.requested_operation}</td><td>${x.requested_tables} / ${x.requested_columns}</td><td>${x.selected_node||'—'}</td><td>${tag(x.decision)}</td><td>${x.reason}</td><td>${x.execution_time}ms</td></tr>`).join('')).catch(e=>rows.innerHTML='<tr><td colspan=6>'+e.message+'</td></tr>')</script></body></html>
